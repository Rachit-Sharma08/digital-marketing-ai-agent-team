# Agents Ka Ghar with Docker Compose.
#
#   docker compose --profile demo up demo                        # the demo day: no token, no Hermes, no mounts
#   echo "AKG_ACCESS_TOKEN=$(openssl rand -hex 24)" >> .env   # once, for live data; keep .env out of git
#   docker compose up -d                                         # live: reads ~/.hermes, read-only
#
# Then open http://localhost:4318 (or your AKG_PORT). The port is published on this machine's loopback only. The
# container listens on 0.0.0.0, which counts as remote, so the live office always requires a token (the server refuses
# to start without one and logs why) and you sign in with it once. The demo serves only fiction, so it needs none.
# (The token is not a compose-level `:?` requirement because compose checks those for every service, demo included.)
# AKG_ALLOW_WRITES=1 turns on chat and task creation, but the image has no `hermes` CLI, so they only work if you
# add one; reading status, tasks, jobs and messages needs only the mounted files.

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped

services:
  office:
    <<: *hardening
    build: .
    image: agents-ka-ghar:local
    ports:
      - "127.0.0.1:${AKG_PORT:-4318}:${AKG_PORT:-4318}" # same port inside and out, so the browser's Origin matches
    environment:
      AKG_PORT: ${AKG_PORT:-4318}
      AKG_ACCESS_TOKEN: ${AKG_ACCESS_TOKEN:-} # required: set it in .env (openssl rand -hex 24)
      AKG_ALLOW_WRITES: ${AKG_ALLOW_WRITES:-0}
      AKG_STATUS_URL: http://host.docker.internal:9119/api/status
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HERMES_HOME:-~/.hermes}:/hermes:ro
      - ${AKG_PORTRAITS_DIR:-~/.agents-ka-ghar/portraits}:/portraits:ro
      - ${AKG_HEADSHOTS_DIR:-~/.agents-ka-ghar/headshots}:/headshots:ro

  demo:
    <<: *hardening
    profiles: ["demo"]
    build: .
    image: agents-ka-ghar:local
    command: ["--demo"] # "Campaign Daybook": the scripted demo day; chat and new tasks stay in memory
    ports:
      - "127.0.0.1:${AKG_PORT:-4318}:${AKG_PORT:-4318}" # same port inside and out, so the browser's Origin matches
    environment:
      AKG_PORT: ${AKG_PORT:-4318}
      AKG_ACCESS_TOKEN: ${AKG_ACCESS_TOKEN:-} # optional for the demo
      AKG_DEMO_SPEED: ${AKG_DEMO_SPEED:-60}
